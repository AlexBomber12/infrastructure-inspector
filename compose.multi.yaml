name: infrastructure-inspector

services:
  inspector:
    image: ${INSPECTOR_IMAGE_ID:?Required verified sha256 image ID}
    pull_policy: never
    user: "65533:65533"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    environment:
      INSPECTOR_HOST_MODE: multi
    volumes:
      - type: bind
        source: ${INSPECTOR_HOST_REGISTRY_PATH:?Required}
        target: /run/secrets/host-registry.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INSPECTOR_HOST_SECRETS_DIR:?Required}
        target: /run/secrets/inspector-hosts
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      mcp-private:
        ipv4_address: ${INSPECTOR_PRIVATE_IP:?Required reserved Inspector address}
        mac_address: ${INSPECTOR_PRIVATE_MAC:?Required reserved Inspector MAC}
      ssh-egress:
        ipv4_address: ${INSPECTOR_EGRESS_IP:?Required reserved Inspector address}

  tunnel-client:
    image: ghcr.io/openai/tunnel-client@sha256:67b473b4bc23bc984e4a381752e9a2fa75649746edc06e46b27025611835c5c0
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      - inspector
    command:
      - --control-plane.tunnel-id=${OPENAI_TUNNEL_ID:?Required}
      - --control-plane.api-key=file:/run/secrets/control-plane-api-key
      - --mcp.server-url=http://inspector:8000/mcp
      - --health.listen-addr=127.0.0.1:8080
    volumes:
      - type: bind
        source: ${OPENAI_TUNNEL_API_KEY_PATH:?Required}
        target: /run/secrets/control-plane-api-key
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - control-plane
      - mcp-private

networks:
  control-plane:
    driver: bridge

  mcp-private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${INSPECTOR_DOCKER_SUBNET:?Required}
          gateway: ${INSPECTOR_DOCKER_GATEWAY:?Required}

  ssh-egress:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: ${INSPECTOR_EGRESS_BRIDGE:?Required dedicated bridge interface}
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: ${INSPECTOR_EGRESS_SUBNET:?Required dedicated nonoverlapping subnet}
          gateway: ${INSPECTOR_EGRESS_GATEWAY:?Required dedicated gateway}
